# NewsSense AI - Source Configuration
# Each category has its own set of sources (RSS feeds, News APIs, official feeds).
# Sources can be enabled/disabled via `active: false` without changing code.
# Priority: high = every 1-2 min (breaking), normal = every 5-15 min, low = every 15-30 min

# ---------------------------------------------------------------------------
# Default settings applied to every source unless overridden
# ---------------------------------------------------------------------------
defaults:
  fetch_interval_minutes: 15
  rate_limit: 60          # requests per hour
  reliability_score: 0.5
  priority: normal
  timeout_seconds: 30
  max_retries: 3
  retry_backoff_base: 2   # exponential backoff base seconds
  retry_backoff_max: 60   # max wait between retries

# ---------------------------------------------------------------------------
# Per-priority fetch intervals (seconds) used by the scheduler
# ---------------------------------------------------------------------------
schedules:
  high: 120       # 2 minutes – breaking news
  normal: 600     # 10 minutes – standard feeds
  low: 1800       # 30 minutes – slow-moving categories

