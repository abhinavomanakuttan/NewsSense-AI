[project]
name = "smartfeed-ai-backend"
version = "1.0.0"
description = "AI-Powered Personalized News Intelligence Platform - Backend"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

# FastAPI idiomatically uses Depends() inside default argument values;
# this is the framework-sanctioned pattern for dependency injection.
[tool.ruff.lint.per-file-ignores]
"app/api/v1/*.py" = ["B008"]
"app/core/dependencies.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/migrations/*"]
